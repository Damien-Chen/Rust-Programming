[package]
name = "rust-programming"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"


[dependencies]
log = "0.4"

# uefi crate: enables logger, panic handler, alloc support and a global allocator
# Check crates.io/docs.rs and pick the latest version if you want (here we use a placeholder).
uefi = { version = "0.36", features = ["alloc", "global_allocator", "logger", "panic_handler"] }

[profile.release]
# smaller binary and no debug symbols by default - adjust if you need debugging
opt-level = "z"
debug = false