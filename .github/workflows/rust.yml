name: CI — Rust UEFI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [nightly]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
          components: clippy, rustfmt, rust-src

      - name: cargo fmt (check)
        run: cargo fmt -- --check

      - name: Install UEFI target
        run: rustup target add x86_64-unknown-uefi

      - name: cargo clippy
        run: cargo clippy --target x86_64-unknown-uefi -- -D warnings

      - name: cargo build
        run: cargo build --target x86_64-unknown-uefi --verbose

      - name: Install QEMU, OVMF and ImageMagick (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools imagemagick

      - name: Find built .efi file (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Looking for .efi under target/..."
          EFI_PATH=$(find target -type f -name '*.efi' | head -n 1 || true)
          if [ -z "$EFI_PATH" ]; then
            echo "No .efi file found in target/ — list target tree for debug:"
            find target -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "EFI_PATH=${EFI_PATH}" >> $GITHUB_ENV
          echo "Found .efi: $EFI_PATH"

      - name: Copy OVMF firmware into workspace (Linux)
        if: runner.os == 'Linux'
        run: |
          # Try common distro locations for OVMF CODE and VARS
          OVMF_CODE=$(find /usr/share -type f -iname 'ovmf_code.fd' -print -quit || true)
          OVMF_VARS=$(find /usr/share -type f -iname 'ovmf_vars.fd' -print -quit || true)

          # fallback: find any OVMF fd and use it as code; vars will be same file if no separate VARS found
          if [ -z "$OVMF_CODE" ]; then
            OVMF_CODE=$(find /usr/share -type f -iname 'ovmf*.fd' -print -quit || true)
          fi
          if [ -z "$OVMF_VARS" ]; then
            OVMF_VARS="$OVMF_CODE"
          fi

          if [ -z "$OVMF_CODE" ]; then
            echo "OVMF firmware files not found under /usr/share. Inspecting /usr/share..."
            find /usr/share -iname '*ovmf*' -maxdepth 4 -print || true
            exit 1
          fi

          cp "$OVMF_CODE" "$GITHUB_WORKSPACE/OVMF_CODE.fd"
          cp "$OVMF_VARS" "$GITHUB_WORKSPACE/OVMF_VARS.fd"
          chmod u+w "$GITHUB_WORKSPACE/OVMF_VARS.fd" || true
          echo "Copied OVMF files to workspace:"
          ls -l OVMF_CODE.fd OVMF_VARS.fd
          echo "OVMF_CODE.fd=$(realpath OVMF_CODE.fd)" >> $GITHUB_ENV
          echo "OVMF_VARS.fd=$(realpath OVMF_VARS.fd)" >> $GITHUB_ENV

      - name: Prepare esp/efi/boot (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p esp/efi/boot
          # copy the built .efi to the exact path the tutorial expects
          if [ -z "${EFI_PATH:-}" ]; then
            echo "EFI_PATH not set"
            exit 1
          fi
          cp "${EFI_PATH}" esp/efi/boot/bootx64.efi
          # Create a test bmp image
          python3 -c "import struct; f = open('esp/image.bmp', 'wb'); f.write(b'BM'); f.write(struct.pack('<I', 54 + 16*16*3)); f.write(struct.pack('<I', 0)); f.write(struct.pack('<I', 54)); f.write(struct.pack('<I', 40)); f.write(struct.pack('<i', 16)); f.write(struct.pack('<i', 16)); f.write(struct.pack('<H', 1)); f.write(struct.pack('<H', 24)); f.write(struct.pack('<I', 0)); f.write(struct.pack('<I', 16*16*3)); f.write(struct.pack('<I', 0)); f.write(struct.pack('<I', 0)); f.write(struct.pack('<I', 0)); f.write(struct.pack('<I', 0)); [f.write(struct.pack('<BBB', 0, 0, 255)) for _ in range(16*16)];"
          ls -l esp/efi/boot/bootx64.efi esp/image.bmp

      - name: Run UEFI app in QEMU and take screenshot (Linux)
        if: runner.os == 'Linux'
        env:
          OVMF_CODE: ${{ env.OVMF_CODE.fd }}
          OVMF_VARS: ${{ env.OVMF_VARS.fd }}
        run: |
          set -euo pipefail
          touch screenshot.ppm

          timeout 30s qemu-system-x86_64 \
            -machine accel=tcg \
            -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=OVMF_VARS.fd \
            -drive format=raw,file=fat:rw:esp \
            -m 128 \
            -vga std \
            -no-reboot \
            -monitor none \
            -net none \
            -serial stdio \
            -display none \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -chardev pipe,id=screenshot,path=screenshot.ppm \
            -device screendump,chardev=screenshot,id=screendump0 &
          
          sleep 15
          convert screenshot.ppm screenshot.png

      - name: Verify screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          # Create a reference image (black background with a red square)
          convert -size 640x480 xc:black -fill red -draw "rectangle 312,232 328,248" reference.png

          # Compare the screenshot with the reference image
          compare -metric AE screenshot.png reference.png diff.png || true
          
          # Check if the images are different
          if [ $(identify -format "%[mean]" diff.png) != "0" ]; then
            echo "::error::Screenshot does not match reference image."
            exit 1
          fi
          echo "Screenshot verification successful."

      - name: Upload artifacts (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: qemu-screenshot
          path: |
            screenshot.png
            reference.png
            diff.png