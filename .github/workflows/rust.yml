name: CI — Rust UEFI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [nightly]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
          components: clippy, rustfmt

      - name: cargo fmt (check)
        run: cargo fmt -- --check

      - name: Install UEFI target
        run: rustup target add x86_64-unknown-uefi

      - name: cargo clippy
        # note: clippy may fail for some no_std/uefi setups if clippy can't target it.
        run: cargo clippy --target x86_64-unknown-uefi -- -D warnings
        # If clippy fails unexpectedly, you can remove the target flag or run clippy on host target only.

      - name: cargo build
        run: cargo build --target x86_64-unknown-uefi --verbose

      # QEMU + image steps only run on Linux runner (ubuntu-latest)
      - name: Install QEMU and FAT tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # qemu-system-x86 and ovmf provide UEFI firmware
          sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools

      - name: Find built .efi file (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Looking for .efi under target/..."
          # find the first .efi produced by the target build and print it
          EFI_PATH=$(find target -type f -name '*.efi' | head -n 1 || true)
          if [ -z "$EFI_PATH" ]; then
            echo "No .efi file found in target/ — list target tree for debug:"
            find target -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "EFI_PATH=${EFI_PATH}" >> $GITHUB_ENV
          echo "Found .efi: $EFI_PATH"

      - name: Create UEFI disk image (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # create a small FAT image and mount it
          dd if=/dev/zero of=uefi.img bs=1M count=32
          sudo apt-get install -y dosfstools # ensure mkfs.fat exists (redundant if installed above)
          mkfs.fat -F32 uefi.img
          mkdir -p mnt
          sudo mount -o loop uefi.img mnt
          sudo mkdir -p mnt/EFI/BOOT
          # copy the built efi (from previous step)
          sudo cp "${EFI_PATH}" mnt/EFI/BOOT/BOOTX64.EFI
          sudo umount mnt
          rm -rf mnt

      - name: Locate OVMF firmware (Linux)
        if: runner.os == 'Linux'
        run: |
          # try to find a suitable OVMF firmware file. prefer CODE.fd if present
          OVMF_FILE=$(find /usr/share -type f -iname 'OVMF*.fd' -print -quit || true)
          if [ -z "$OVMF_FILE" ]; then
            # fallback common paths
            if [ -f /usr/share/ovmf/OVMF.fd ]; then
              OVMF_FILE=/usr/share/ovmf/OVMF.fd
            fi
          fi
          if [ -z "$OVMF_FILE" ]; then
            echo "OVMF firmware file not found. Inspect /usr/share for OVMF files."
            find /usr/share -iname '*ovmf*' -maxdepth 4 -print || true
            exit 1
          fi
          echo "OVMF_FILE=${OVMF_FILE}" >> $GITHUB_ENV
          echo "Using OVMF firmware: $OVMF_FILE"

      - name: Run UEFI app in QEMU (Linux)
        if: runner.os == 'Linux'
        env:
          OVMF_FILE: ${{ env.OVMF_FILE }}
        run: |
          # Use OVMF as a pflash; map serial to stdio so we can capture UEFI console output
          # -no-reboot makes QEMU exit instead of continuously rebooting guest
          qemu-system-x86_64 \
            -nographic \
            -machine accel=tcg \
            -drive if=pflash,format=raw,readonly=on,file="${OVMF_FILE}" \
            -drive format=raw,file=uefi.img,if=virtio \
            -serial stdio \
            -no-reboot \
            -monitor none
